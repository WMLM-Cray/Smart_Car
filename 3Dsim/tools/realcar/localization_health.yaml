# localization_health.yaml —— /localization_ok 定位健康发布端阈值模板（2026-09-20）
#
# 用法（车机/WSL）：
#   python3 localization_health.py --ros-args -p thresholds_file:=$PWD/localization_health.yaml
#
# 关键：verified 是总开关。
#   verified: false  → 节点永不发 True（只发 False + 诊断，供影子运行记录判定）。
#   verified: true   → 阈值已现场标定，才可能发 True。
#   未标定前**不要**改成 true，否则是"偷偷用默认值放行"，违反失效安全红线。
#
# 阈值标定方法（现场，影子运行阶段完成，见 LOCALIZATION_HEALTH_INTERFACE.md §5）：
#   - 断流超时：看正常运行时 /scan、/odom_combined、TF 的最大间隔，取 2~3 倍留余量。
#   - AMCL 更新判据（累计运动，非瞬时速度+固定超时）：静止/微动时 AMCL 不更新是设计行为，
#     不判失效；判据看"自上次 AMCL 更新以来的累计位移/转角是否超过现役 update_min_d/a 的
#     2~3 倍"，超了却仍不更新才判异常。累计门限须对照现役 AMCL 参数（现场取证）。
#   - 协方差：静止收敛后看 amcl_pose 的 cov[0]/cov[7]/cov[35] 稳定值，阈值取稳定值的
#     数倍（位置米 / 角度弧度分开，不混比）。
#   - 一致性：正常导航时看 AMCL↔odom 位置差（经 map→odom TF 换算）的波动上限，取数倍。
#     注意：一致性是辅助判据，AMCL 与 odom 共享里程计，一致≠定位正确。

verified: false

# ---- 断流超时（秒，单调时钟）----
scan_timeout: 1.0
tf_timeout: 1.0
odom_timeout: 1.0

# ---- AMCL 更新判据（累计运动，非瞬时速度+固定超时）----
amcl_stale_moving: 1.0          # 累计运动已超门限后，AMCL 仍不更新的容忍时间(秒)
amcl_stale_static: 10.0         # 弃用：静止不更新≠失效，保留字段兼容，不参与判定
motion_cum_linear: 0.5          # 累计位移门限(米)，= 现役 update_min_d × 2~3
motion_cum_angular: 0.5         # 累计转角门限(弧度)，= 现役 update_min_a × 2~3

# ---- 运动判定阈值（弃用：瞬时速度判据已被累计运动取代，保留字段兼容）----
motion_linear_thresh: 0.05     # m/s
motion_angular_thresh: 0.05    # rad/s

# ---- 协方差 σ 阈值（位置米 / 角度弧度分开，不混比）----
cov_pos_sigma: 0.5
cov_yaw_sigma: 0.5

# ---- 一致性（辅助，米）----
consistency_dist: 0.5

# ---- header.stamp 回退容忍（秒）----
stamp_regress_tol: 0.5
