# 回归场景 4：11 点整圈（仅回归，不以挑选成功轮次收尾——原始结果如实报告）。
# ⚠️ 坐标为占位矩形环（map 系，米），非官方 A 赛道坐标；接入主线地图后须按
# 实际 A 赛道重写。11 点构成闭环，起点/终点同点用于整圈回归。
mission:
  frame_id: map
  mode: multi
  loop: false
  on_failure: skip       # 整圈回归：单点失败不中断，如实记录全部 11 点结果
  default:
    timeout: 30.0
    xy_tolerance: 0.1
    yaw_tolerance: 0.1
  goals:
    - { name: lap_01, seq: 1,  x: 0.0,  y: 0.0,  yaw: 0.0 }
    - { name: lap_02, seq: 2,  x: 1.0,  y: 0.0,  yaw: 0.0 }
    - { name: lap_03, seq: 3,  x: 2.0,  y: 0.0,  yaw: 0.0 }
    - { name: lap_04, seq: 4,  x: 3.0,  y: 0.0,  yaw: 1.5708 }
    - { name: lap_05, seq: 5,  x: 3.0,  y: -1.0, yaw: 3.1416 }
    - { name: lap_06, seq: 6,  x: 2.0,  y: -1.0, yaw: 3.1416 }
    - { name: lap_07, seq: 7,  x: 1.0,  y: -1.0, yaw: 3.1416 }
    - { name: lap_08, seq: 8,  x: 0.0,  y: -1.0, yaw: -1.5708 }
    - { name: lap_09, seq: 9,  x: 0.0,  y: -0.5,  yaw: 0.0 }
    - { name: lap_10, seq: 10, x: 0.5,  y: 0.0,  yaw: 0.0 }
    - { name: lap_11, seq: 11, x: 0.0,  y: 0.0,  yaw: 0.0 }
