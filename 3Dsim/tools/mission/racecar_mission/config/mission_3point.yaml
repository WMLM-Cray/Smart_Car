# 回归场景 3：3 点短序列。
mission:
  frame_id: map
  mode: multi
  loop: false
  on_failure: stop
  default:
    timeout: 20.0
    xy_tolerance: 0.1
    yaw_tolerance: 0.1
  goals:
    - name: p1
      seq: 1
      x: 1.0
      y: 0.0
      yaw: 0.0
    - name: p2
      seq: 2
      x: 2.0
      y: 0.5
      yaw: 0.7854
    - name: p3
      seq: 3
      x: 3.0
      y: 0.0
      yaw: 0.0
