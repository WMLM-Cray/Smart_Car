# 实车首测目标集（模板，默认禁用）。
#
# 约定：
# - enabled: false —— 任务器拒绝启动本文件，须等主线实车单点导航通过后，由主线
#   生成真实坐标并显式改为 enabled: true 才可用。
# - 第一个目标 = 车头前方短距离（方向 0，短距离），用于验证“下发即前进”。
# - 坐标不写死地图值：这里的 x/y 是相对当前定位原点的占位，待主线定位完成后
#   用 gen_realcar_goals.py 依据实测原点/朝向生成正式文件。
# - 实车多点模式必须在主线单点通过后才允许启用（本模板 mode: multi 仅在
#   enabled: true 且主线确认后使用）。
mission:
  enabled: false
  frame_id: map
  mode: multi
  loop: false
  on_failure: stop
  default:
    timeout: 30.0
    xy_tolerance: 0.15
    yaw_tolerance: 0.2
  goals:
    - name: ahead_short      # 车头前方短距离（待定位后替换为真实坐标）
      seq: 1
      x: 1.0                 # 占位：相对定位原点的短距离前向
      y: 0.0
      yaw: 0.0
    - name: ahead_second     # 第二点：继续前向（待定位后替换）
      seq: 2
      x: 2.0
      y: 0.0
      yaw: 0.0
