# racecar_mission 任务文件样例。
# 顶层 mission；enabled 可选（默认 true，false 时任务器拒绝启动）。
# 到达容差 xy_tolerance / yaw_tolerance 仅作验收记录，不覆盖 Nav2 参数。
mission:
  frame_id: map            # 默认目标坐标系（必填，须在 allowed_frames 内）
  robot_base_frame: base_footprint   # 量测最终位姿误差用的机器人 frame
  mode: multi              # single=单点 / multi=连续多点
  loop: false              # 是否循环；默认 false，必须显式开启
  on_failure: stop         # 失败后策略：stop=停止 / skip=跳到下一点
  default:
    timeout: 30.0          # 单点超时秒数（0 或省略=不设超时）
    xy_tolerance: 0.1      # 仅验收记录
    yaw_tolerance: 0.1     # 仅验收记录
  goals:
    - name: straight_1     # 名称（必填，非空，唯一）
      seq: 1               # 序号（必填，正整数，唯一）
      x: 1.5               # 有限数（必填）
      y: 0.0
      yaw: 0.0
    - name: turn_1
      seq: 2
      x: 2.5
      y: 1.0
      yaw: 1.5708
    - name: straight_2
      seq: 3
      x: 4.0
      y: 0.0
      yaw: 0.0
