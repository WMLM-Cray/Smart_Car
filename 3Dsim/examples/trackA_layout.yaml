# 赛道 A 2026 图 9A 逐桶数据副本；主文件为 docs/track/trackA_layout.yaml
# 锥桶逐点读图；边界段为未校准的旧仿真模型。
# 赛道A 图9A逐桶坐标；边界段为未校准的旧仿真模型
