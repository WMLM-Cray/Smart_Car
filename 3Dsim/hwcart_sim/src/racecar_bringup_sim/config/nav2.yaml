# =============================================================================
# 阶段3 第四步:Nav2 单点导航参数(trackA,阿克曼配置,不原地转向)
# 场景:navigation_bringup.launch.py = localization_bringup(仿真+map_server+
#       AMCL,见 amcl.yaml)+ 本文件的导航栈;速度链 controller_server
#       →(cmd_vel_nav)→ velocity_smoother →(/cmd_vel)→ sim_wiring → 车
#
# 阿克曼约束(冻结 params.yaml):底盘 0.56×0.35m,轴距 0.36,舵角极限
#   0.55rad → 最小转弯半径 0.36/tan(0.55)=0.587m(右U瓶颈1.18m/远左发卡
#   走廊1.22m,均>直径1.174m,可过但余量厘米级——控制层须收缩前瞻防切角)。
# "不原地转向"三重落实:
#   ① FollowPath=RegulatedPurePursuit,use_rotate_to_heading:false;
#   ② 行为服务器只加载 Wait(不装 Spin/BackUp);
#   ③ 行为树 trackA_minimal.xml 恢复分支只有 清代价地图+等待(无 Spin)。
#
# 插件名逐一对照本机 /opt/ros/humble/share/**.xml 实测注册名(2026-09-16):
#   nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController(双冒号)
#   nav2_navfn_planner/NavfnPlanner(斜杠) nav2_behaviors/Wait(斜杠)
#   nav2_costmap_2d::{StaticLayer,ObstacleLayer,InflationLayer}(双冒号)
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /ackermann_steering_controller/odometry   # 实际里程计话题(非默认 odom)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # yaw 0.25→0.50:0.25rad=14° 过紧,中间点贴近时朝向差 30-45° 不收 →
      # 原地转向已禁 → 只能绕圈对齐 → 1.22m 走廊绕圈蹭锥(第三轮 S 弯中点
      # 两次到 0.03m 不收,绕圈 68s 后 AMCL 漂 1.08m 全灭)
      # xy 0.20→0.15:检查器按 AMCL 系判收,第九轮 AMCL 误差 ~0.11 使真值
      # 到达 0.31>0.30 判据;收紧后真值上界 0.15+定位误差≈0.29
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.50
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.18 回退→0.25(第十一轮单样本事故后回退;降速对瓶紧间隙方差的
      # 作用未测得,仍为待验证假设):该轮降速后未到瓶紧处即死于短跳段
      # 事故——右U上口→出口 0.9m 短跳段终点朝向绕圈(低速拖长绕圈,AMCL
      # 漂 0.231,重规划 Dubins 环线南掉进 r15/r16 凹兜撞锥 −0.016,3/11
      # 全灭)。0.25 在 R9/R10 两次安全通过该段;短跳诱因另行修复(nav_check
      # 目标4 朝向 180°→200° 与锚点终态带对中,R12 验证治愈)。另:RPP
      # 碰撞检测前探=v×1.0s,降速把以米计的安全前探从 0.25 缩到 0.18。
      desired_linear_vel: 0.25
      # 前瞻双约束(RPP 的 κ_cmd=2y/L² 不受阿克曼上限约束,过短→修正曲率
      # 饱和震荡(第二轮 S 弯震荡 68s、指令层 ω/v 超 1.7 上限 96 次);
      # 过长→弦切弯心蹭内锥(首轮 0.7m 前瞻右U蹭锥)。取 L=0.45~0.5:
      #   误差修正能力 κ=2×0.1/0.45²=0.99 < 1/0.587=1.703(不饱和)
      #   弦垂距 L²/8R=0.45²/(8×0.6)=4.2cm(切角可忽略)+ 降速 0.25m/s
      lookahead_dist: 0.50
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.9
      lookahead_time: 1.8
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      # 靠近代价地图障碍时额外降速(1.22m 窄走廊内多一层安全)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.5
      regulated_linear_scaling_min_radius: 0.6   # 对齐最小转弯半径0.587
      regulated_linear_scaling_min_speed: 0.07
      use_rotate_to_heading: false        # ← 阿克曼:禁原地转向
      allow_reversing: false              # ← 本步不倒车
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0  # (rotate 关闭,该项不生效)
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      # RPP 的曲率调节/碰撞检测要读车速 → 指到实际里程计话题
      odom_topic: /ackermann_steering_controller/odometry

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    # [线x, 线y, 角yaw]:y 恒 0(非完整约束);线不允许倒车;角允许双向
    max_velocity: [0.5, 0.0, 1.2]
    min_velocity: [0.0, 0.0, -1.2]
    max_accel: [0.6, 0.0, 2.0]
    max_decel: [-0.6, 0.0, -2.0]
    odom_topic: /ackermann_steering_controller/odometry
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    feedback: "OPEN_LOOP"   # 开环:平滑器不依赖里程计反馈

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Hybrid-A*(DUBIN 运动模型,不倒车):路径曲率受最小转弯半径约束,
      # 阿克曼可直接跟踪——首版 NavFn 网格最短路在 U 弯口产生楼梯尖角,
      # RPP 跟踪时指令曲率饱和(κ≈3.3>1/0.587)卡死,2026-09-16 实测
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.60   # 冻结 0.36/tan(0.55)=0.587 略放余量
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      # cost_penalty 2.0→3.0:1.22m 走廊内压着中心线走(首轮右U最小间隙
      # 0.001m 贴锥,提高代价格权重把路径顶离膨胀带)
      cost_penalty: 3.0
      retrospective_penalty: 0.0
      lookup_table_size: 20.0
      cache_lookup_table_size: 1000.0
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]           # ← 只装 Wait:不装 Spin/BackUp
    wait:
      plugin: "nav2_behaviors/Wait"
      enabled: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /ackermann_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # 恢复分支只有 清代价地图+等待 的极简行为树(见 behavior/trackA_minimal.xml)
    default_bt_xml_filename: ""          # 由 navigation_bringup.launch.py 注入绝对路径
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_wait_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_recovery_node_bt_node

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.3
      # 冻结整车矩形 0.56×0.35(底盘,不含上层结构;足印即碰撞外形)
      footprint: "[[0.28, 0.175], [0.28, -0.175], [-0.28, -0.175], [-0.28, 0.175]]"
      # 像素锥补偿:占据格=5cm 像素,物理锥=0.28 直径圆柱,格心足印判定对
      # 每锥欠估约 5-8cm。0.06 治愈右U恒定 -2.8cm 侵入(第五轮 9/9 全成),
      # 但右U残余间隙 0.086<0.10 → 加厚到 0.08(走廊最窄 1.18m,垫后内切
      # 0.255 两侧仅占 0.51,通行性余量充足,离线 goal_footprint_audit 验证)
      footprint_padding: 0.08
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_distance: 25.0
          obstacle_max_range: 6.0
          raytrace_max_range: 8.0
          clearing: true
          marking: true
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.50   # 0.45→0.50:加厚软代价墙,Smac 路径更靠走廊中线
        # (253 内切带仍由 0.175 决定,不收紧通行性;道内自由宽 1.22m)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      footprint: "[[0.28, 0.175], [0.28, -0.175], [-0.28, -0.175], [-0.28, 0.175]]"
      footprint_padding: 0.08   # 同局部图:像素锥补偿(见上)
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.50
      always_send_full_costmap: true

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # 定位侧(map_server/amcl)由 localization_bringup 的管理器负责,互不重叠
    node_names: ["controller_server", "velocity_smoother",
                 "planner_server", "behavior_server", "bt_navigator"]
