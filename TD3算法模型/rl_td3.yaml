# RL(TD3)实验配置 —— training/road_td3.py 的唯一默认值来源。
# 命令行参数可覆盖这里的值;解析后的完整配置(含覆盖)会写进 runs/*/config.json。
# 种子划分约定(互不重叠):DAgger 训练 10M / 挑模型 50M / RL 赛道池 20M / 评测 90M。

# ===== 速度契约 =====
schema: road_v2.5          # 赛道池按哪个速度契约抽车辆参数(要和 train --init 的一致)

# ===== 赛道池(pool 用 training/road_rl.py 生成,两算法共用)=====
pool_seed0: 20000000       # RL 赛道池种子起点,与训练/挑模型/测试种子不重叠
count: 4000                # 池里多少局
mix: 'L5:0.2,L5s:0.2,L6h:0.15,L6f:0.15,L4:0.15,L6:0.1,L3:0.05'   # 各路段采样占比
cap_max: 1.8               # 速度上限抽样上限 m/s

# ===== 奖励(与 PPO 完全一致,保证算法对比可比)=====
crash: 50.0                # 撞/出界扣分(m 当量)
time_cost: 0.02            # 每拍时间代价(m)
slip: 0.5                  # 每拍 × 打滑程度(0~1)
max_steps: 3000            # 一局最多多少拍

# ===== TD3 训练 =====
iters: 100
episodes: 112              # 每轮采多少局
workers: 7
torch_threads: 2
seed: 0
gamma: 0.99
tau: 0.005                 # 目标网络软更新系数
lr: 0.00005                # actor 学习率(与 PPO 保守版一致)
lr_critic: 0.0003          # 双 Q 评论家学习率
batch: 256
buffer: 500000             # 回放缓冲区容量(条);obs 存 float16,约 0.5GB
utd: 1.0                   # 每条新数据做几次梯度更新
max_updates: 20000         # 每轮梯度更新上限
warmup: 5000               # 缓冲区攒够多少条才开始更新
explore_std: 0.1           # 采集时的高斯探索噪声(与 PPO std0 一致)
target_noise: 0.2          # 目标策略平滑噪声
noise_clip: 0.5            # 目标噪声截断
policy_delay: 2            # 每几次评论家更新更新一次策略(延迟更新)
rounds: 8                  # 每轮采集拆成几批交错更新(整批采集+集中更新会让策略漂移过远)
bc: 10.0                   # actor 锚定系数:偏离初始模型动作的 MSE 惩罚(Q 平坦时压住 Adam 噪声步)
eval_every: 5              # 每几轮在挑模型种子上评估一次
eval_levels: 'L5,L5s,L6h,L4c,L6f'
eval_count: 240
