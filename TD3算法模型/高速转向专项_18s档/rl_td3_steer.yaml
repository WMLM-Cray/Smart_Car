# RL(TD3)高速转向专项配置 —— 目标:官方赛道 lap2 进 18s 档。
# 诊断链:cap2.4 plan 模式 B/D 已 19.7-20.6s,残差在模型转向(急弯外抛/走线偏中线)。
# 方案:采集时速度分量被 v_plan 剖面接管(与 evaluation.road_lap2 plan 模式同源,
# a_lat=1.8+急弯分档 1.4),策略只学高速转向 —— TD3 的转向自由度对齐评测形态。
# 奖励沿用激进档(crash 15);bc 锚定从 5 降到 3:允许更大胆偏离保守初始化,
# 但保留防平坦 Q 下 Adam 漂移的最小锚定。
# 池/种子与 fast/aggr 一致(30M 高速池);评测仍用 96M 系列。

schema: road_v2.5

# ===== 高速赛道池(共用 runs/rl_pool_fast.pkl) =====
pool_seed0: 30000000
count: 4000
mix: 'L5:0.2,L5s:0.2,L6h:0.15,L6f:0.15,L4:0.15,L6:0.1,L3:0.05'
cap_max: 2.4

# ===== 奖励(激进档,与 rl_td3_aggr.yaml 一致) =====
crash: 15.0
time_cost: 0.0
slip: 0.3
max_steps: 3000

# ===== 转向专项:v_plan 剖面接管速度(核心差异) =====
v_plan_a_lat: 1.8            # 普通弯横向加速度假设 m/s²
v_plan_a_lat_low: 1.4        # 急弯(κ≥split)降档 —— A@s58.5 实测 1.8 档 8/30 撞
v_plan_kappa_split: 0.55     # 急弯分档阈值 1/m
v_plan_a_acc: 0.6            # 前向加速假设(贴近真实 accel_up 0.4~1.0)
v_plan_a_dec: 0.55           # 制动假设(真实 decel 0.68~0.78 留死区余量)

# ===== TD3(init = 激进版最优 candidate_008,见命令行 --init) =====
iters: 40
episodes: 112
workers: 7
torch_threads: 2
seed: 0
gamma: 0.99
tau: 0.005
lr: 0.00005
lr_critic: 0.0003
batch: 256
buffer: 500000
utd: 1.0
max_updates: 20000
warmup: 5000
explore_std: 0.1
target_noise: 0.2
noise_clip: 0.5
policy_delay: 2
rounds: 8
bc: 3.0                     # 锚定的"初始模型"= 激进版 candidate_008
eval_every: 3
eval_levels: 'L5,L5s,L6h,L4c,L6f'
eval_count: 240
