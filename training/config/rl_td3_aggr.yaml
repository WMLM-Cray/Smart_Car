# RL(TD3)激进奖励实验配置 —— 目标:官方赛道 lap2 ≤ 20s(平均 ~1.8 m/s)。
# 诊断:cap2.4 下 lap2 仍 27-28s,瓶颈是模型保守(crash=50 使策略不敢贴极限过弯)。
# 与 rl_td3_fast.yaml 的差异只在奖励三项与 bc 锚定:
#   crash 50→15     撞车恐惧大幅下降,敢用更晚的制动点与更高的弯速
#   time_cost 0.02→0 奖励本身已是 Δs(进度),time_cost 是变相限速,去掉
#   slip 0.5→0.3   略放松打滑惩罚,允许贴摩擦圆过弯
#   bc 10→5        允许更大胆偏离保守初始化(保留锚定防平坦Q下Adam漂移)
# 池/种子与 fast 版完全一致(30M 高速池),评测仍用 96M 系列。

schema: road_v2.5

# ===== 高速赛道池(与 fast 版共用 runs/rl_pool_fast.pkl) =====
pool_seed0: 30000000
count: 4000
mix: 'L5:0.2,L5s:0.2,L6h:0.15,L6f:0.15,L4:0.15,L6:0.1,L3:0.05'
cap_max: 2.4

# ===== 激进奖励(本实验的核心差异) =====
crash: 15.0
time_cost: 0.0
slip: 0.3
max_steps: 3000

# ===== TD3(不变;init = fast 版最优 candidate_008,见命令行 --init) =====
iters: 40
episodes: 112
workers: 7
torch_threads: 2
seed: 0
gamma: 0.99
tau: 0.005
lr: 0.00005
lr_critic: 0.0003
batch: 256
buffer: 500000
utd: 1.0
max_updates: 20000
warmup: 5000
explore_std: 0.1
target_noise: 0.2
noise_clip: 0.5
policy_delay: 2
rounds: 8
bc: 5.0                    # 锚定的"初始模型"= 热启动的 candidate_008
eval_every: 3
eval_levels: 'L5,L5s,L6h,L4c,L6f'
eval_count: 240
