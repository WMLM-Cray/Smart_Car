# RL(TD3)高速档实验配置 —— 目标:官方赛道 lap2 ≤ 20s(平均 ~1.8 m/s)。
# 与 rl_td3.yaml 的差异只在前 4 项:高速池(cap_max 2.4)、热启动(已有 TD3 模型)、
# 更密的评估抓峰、更少的轮数(历史经验:峰值出现在前 10 轮,之后渐进劣化)。
# 种子划分:高速池 30M(与既有 20M 池/90M+ 评测种子不重叠),评测仍用 96M 系列。

schema: road_v2.5

# ===== 高速赛道池 =====
pool_seed0: 30000000
count: 4000
mix: 'L5:0.2,L5s:0.2,L6h:0.15,L6f:0.15,L4:0.15,L6:0.1,L3:0.05'
cap_max: 2.4               # v_top ~2.16-2.28;20s 需平均 1.78,留弯道减速余量

# ===== 奖励(不变,保证与旧模型可比) =====
crash: 50.0
time_cost: 0.02
slip: 0.5
max_steps: 3000

# ===== TD3(不变;init 换成热启动模型,见命令行 --init) =====
iters: 40
episodes: 112
workers: 7
torch_threads: 2
seed: 0
gamma: 0.99
tau: 0.005
lr: 0.00005
lr_critic: 0.0003
batch: 256
buffer: 500000
utd: 1.0
max_updates: 20000
warmup: 5000
explore_std: 0.1
target_noise: 0.2
noise_clip: 0.5
policy_delay: 2
rounds: 8
bc: 10.0                   # 锚定的"初始模型"= 热启动的 candidate_004
eval_every: 3              # 更密抓峰(峰值预计在前 10 轮)
eval_levels: 'L5,L5s,L6h,L4c,L6f'
eval_count: 240
