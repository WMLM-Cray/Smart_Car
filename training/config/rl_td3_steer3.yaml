# RL(TD3)高速转向专项三阶段 —— 用户要求口径:训练集测 1600 局 + 单赛道 30 圈 + 不同限速条件。
# 训练/内评的 cap 均按 cap_max 以下随机抽样(池实测 0.45~2.4 均匀分布),
# 天然覆盖"不同限速条件";本阶段核心变化是内评从 240 局加严到 1600 局,
# 评测等级从 5 级扩到与池分布一致的 7 级 —— 挑模型直接用训练集 1600 局成功率。
# 热启动 = 二阶段最优 candidate_039(plan 2.6/1.8 实测平均 18.63s)。

schema: road_v2.5

# ===== 高速赛道池(共用 runs/rl_pool_fast.pkl) =====
pool_seed0: 30000000
count: 4000
mix: 'L5:0.2,L5s:0.2,L6h:0.15,L6f:0.15,L4:0.15,L6:0.1,L3:0.05'
cap_max: 2.4

# ===== 奖励(与一/二阶段一致,激进档) =====
crash: 15.0
time_cost: 0.0
slip: 0.3
max_steps: 3000

# ===== 转向专项:v_plan 剖面 2.6/1.8(与二阶段一致) =====
v_plan_a_lat: 2.6
v_plan_a_lat_low: 1.8
v_plan_kappa_split: 0.55
v_plan_a_acc: 0.6
v_plan_a_dec: 0.55

# ===== TD3(init = 二阶段最优 candidate_039) =====
iters: 40
episodes: 112
workers: 7
torch_threads: 2
seed: 0
gamma: 0.99
tau: 0.005
lr: 0.00005
lr_critic: 0.0003
batch: 256
buffer: 500000
utd: 1.0
max_updates: 20000
warmup: 5000
explore_std: 0.1
target_noise: 0.2
noise_clip: 0.5
policy_delay: 2
rounds: 8
bc: 3.0                     # 锚定的"初始模型"= 二阶段 candidate_039
eval_every: 5               # 1600 局内评成本高,降频到每 5 轮
eval_levels: 'L5,L5s,L6h,L6f,L4,L6,L3'   # 对齐池分布的 7 级
eval_count: 1600            # 用户口径:训练集 1600 局
