# =============================================================================
# 仿真车集中参数(v0 假设值,实车实测后改这里,全局生效)
# 标注[实测]的项 = 下次碰车用 docs/reference/测量清单.md 量出真值替换
# 标注[规则]的项 = 来自比赛规则 4.4 节,可信
# 标注[源码]的项 = 来自出厂源码 contract.json,可信
# =============================================================================

racecar_sim:
  # --- 底盘几何 ---
  chassis_length: 0.56        # [规则] 底盘长 560mm
  chassis_width: 0.35         # [规则] 底盘宽 350mm
  chassis_height: 0.10        # [实测] 底盘主体可视厚度(230mm 是整车含上层结构,box 先给主体)
  chassis_z: 0.15             # [源码] base_footprint→base_link z=0.15(实车 TF 硬编码)
  ground_clearance: 0.06      # [假设] 底盘离地间隙(假设)
  wheel_radius: 0.09          # [实测 2026-09-16] 车轮半径(轮径180mm,用户卷尺核实与本值一致)
  wheel_width: 0.05           # [假设] 轮宽(假设)
  wheel_base: 0.35            # [实测 2026-09-30 用户按雷达位置逐项量,和 common/params.py 同一个数](09-22 记 0.33;原 0.36 为 09-16 记录;出厂源码 0.305 是别的车)
  wheel_track: 0.28           # [用户确认 2026-09-24] 左右轮中心距 28cm；与前后轴距 33cm 分开
  max_steer_angle: 0.55       # [假设] 车轮关节限位；不是等效自行车角，需验证转弯半径
  # --- 质量 ---
  mass_chassis: 8.0           # [假设] 含电池整备质量 kg(假设;电机2400W级别,整车约5-10kg)
  mass_wheel: 0.4             # [假设] 单轮 kg(假设)
  # --- 传感器外参(TF 策略:厂家 frame 原样保留,传感器挂新增 *_sensor_link) ---
  # laser_link / IMU_link 按[源码契约]保留厂家值(z=0),不挂传感器;
  # laser_sensor_link / imu_sensor_link = 实际安装高度(下面 z 值,假设待实测),
  # 传感器消息 frame_id 用 *_sensor_link,与真实测量位置一致
  laser_x: 0.145              # [实测 2026-09-30] 后轴 -> 雷达(厂家 TF 写 0.07,不对)
  laser_z: 0.28               # [实测 2026-09-30] laser_sensor_link 离地高度
  camera_x: 0.24              # [假设] 相机前向偏移(假设;相机无厂家 TF)
  camera_z: 0.24              # [假设] 相机离地高度(假设)
  imu_x: 0.1653               # [源码] base_footprint→IMU_link x(厂家 TF)
  imu_z: 0.18                 # [假设] imu_sensor_link 离地高度(假设)
  # --- 雷达参数(对齐镭神 X10/M10P) ---
  # [实车确认 2026-09-16] 实测发布频率 11.99Hz、每帧 1667 点;
  # 仿真目标取整 12Hz(不为复现测量小数设 11.99),文档区分两种模式
  lidar_hz: 12                # [实车实测 11.99 → 仿真目标 12]
  lidar_min_range: 0.15       # [源码] min_range
  lidar_max_range: 25.0       # [规则] 量程25-30m(源码软件裁剪50m,取硬件25)
  lidar_samples: 1667         # [实车确认] 每帧 1667 点(旧值 2000=建模折算已废);
                              #   角度端点仍为 ±π 含两端 → 步进 2π/1666≈0.21608°,
                              #   实车 angle_min/max/increment/scan_time/
                              #   time_increment 尚未逐项对齐(缺实车字段值)
  # --- 相机参数 ---
  cam_width: 640
  cam_height: 480
  cam_hz: 30
  cam_hfov: 2.618             # [建模选择] 150°(规则未说明水平/对角,先按水平)
  # --- IMU ---
  imu_hz: 100                 # [实车确认 2026-09-16] 实测 100Hz(旧值 200 为假设已废)
