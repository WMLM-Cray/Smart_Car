# =============================================================================
# controller_manager + ackermann_steering_controller 参数
# 接口按本机已装版本核对(2026-09-13, ros2_controllers 2.53.3):
#   strings libackermann_steering_controller.so 抠出参数名
#   front_wheels_names / rear_wheels_names / wheelbase / front_wheel_track /
#   rear_wheel_track / front_wheels_radius / rear_wheels_radius / open_loop
# ⚠️ 几何数值与 config/params.yaml 保持同步(改那边时同步这里,静态文件无法引用)
# =============================================================================

controller_manager:
  ros__parameters:
    update_rate: 100          # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    # 关节名 = racecar.xacro 中 ros2_control 块的 joint name
    front_wheels_names:
      - left_steering_joint
      - right_steering_joint
    rear_wheels_names:
      - left_rear_wheel_joint
      - right_rear_wheel_joint
    # 几何(= params.yaml: wheel_base / wheel_track / wheel_radius)
    wheelbase: 0.36            # [实测假设] 待实测替换
    front_wheel_track: 0.30    # [实测假设]
    rear_wheel_track: 0.30     # [实测假设]
    front_wheels_radius: 0.09  # [实测假设]
    rear_wheels_radius: 0.09   # [实测假设]
    open_loop: false           # 闭环:轮速反馈参与运动学
    use_sim_time: true
    # 里程计 TF:steering_controllers_library 默认 enable_odom_tf=false
    # (与 diff_drive 默认 true 不同,不开就没有 odom frame,2026-09-14 实测)
    enable_odom_tf: true
    odom_frame_id: odom
    base_frame_id: base_footprint
    # /cmd_vel 接线:gzserver 不解析 --ros-args,无法 remap;由 racecar_sim
    # 的 cmd_vel_relay 节点转发到 ~/reference_unstamped(见 launch 第 5 步)
